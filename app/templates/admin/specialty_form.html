{% extends "base_admin.html" %}

{% block page_title %}إضافة تخصص جديد{% endblock %}

{% block admin_content %}
<div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100 max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">إضافة تخصص جديد</h2>

    <form method="POST">
        <div class="space-y-4">
            <!-- الاسم باللاتينية -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">الاسم (باللاتينية) *</label>
                <input type="text" name="name" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500"
                       placeholder="مثال: Cardiology">
                <p class="text-xs text-gray-500 mt-1">مثل: Cardiology, Dermatology, Pediatrics</p>
            </div>

            <!-- الاسم بالعربية -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">الاسم (بالعربية) *</label>
                <input type="text" name="name_ar" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500"
                       placeholder="مثال: أمراض القلب">
            </div>

            <!-- الأيقونة -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">الأيقونة</label>
                <input type="text" name="icon"
                       class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500"
                       placeholder="مثال: heart, stethoscope, brain">
                <p class="text-xs text-gray-500 mt-1">اختر أيقونة من <a href="https://fontawesome.com/icons" target="_blank" class="text-primary-600 hover:underline">Font Awesome</a></p>
            </div>
        </div>

        <div class="mt-6 flex gap-4">
            <button type="submit"
                    class="px-6 py-3 bg-primary-600 text-white rounded-xl hover:bg-primary-700 transition font-semibold">
                <i class="fas fa-plus ml-2"></i> إضافة التخصص
            </button>
            <a href="{{ url_for('admin.specialties') }}"
               class="px-6 py-3 border border-gray-300 rounded-xl hover:bg-gray-50 transition font-semibold">
                إلغاء
            </a>
        </div>
    </form>
</div>
{% endblock %}
