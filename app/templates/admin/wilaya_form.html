{% extends "base_admin.html" %}

{% block page_title %}
إضافة ولاية
{% endblock %}

{% block admin_content %}

<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm p-6">

    <h2 class="text-2xl font-bold text-gray-800 mb-6">
        إضافة ولاية جديدة
    </h2>

    <form method="POST">

        

    <!-- اسم الولاية -->
    <div class="mb-4">

        <label class="block text-sm font-medium text-gray-700 mb-1">
            اسم الولاية باللاتينية
        </label>

        <input
            type="text"
            name="name"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-xl"
            placeholder="Alger"
        >

    </div>

       


        <!-- الاسم بالعربية -->
        <div class="mb-4">

            <label class="block text-sm font-medium text-gray-700 mb-1">
                اسم الولاية بالعربية
            </label>

            <input
                type="text"
                name="name_ar"
                required
                class="w-full px-4 py-3 border border-gray-300 rounded-xl"
                placeholder="الجزائر"
            >

        </div>


        <!-- الكود -->
        <div class="mb-6">

            <label class="block text-sm font-medium text-gray-700 mb-1">
                رمز الولاية
            </label>

            <input
                type="text"
                name="code"
                required
                maxlength="5"
                class="w-full px-4 py-3 border border-gray-300 rounded-xl"
                placeholder="16"
            >

            <p class="text-xs text-gray-500 mt-1">
                مثال: 16 للجزائر، 31 لوهران، 25 لقسنطينة
            </p>

        </div>


        <!-- الأزرار -->
        <div class="flex gap-3">

            <button
                type="submit"
                class="px-6 py-3 bg-primary-600 text-white rounded-xl hover:bg-primary-700"
            >
                إضافة الولاية
            </button>

            <a
                href="{{ url_for('admin.wilayas') }}"
                class="px-6 py-3 border border-gray-300 rounded-xl"
            >
                إلغاء
            </a>

        </div>

    </form>

</div>

{% endblock %}
