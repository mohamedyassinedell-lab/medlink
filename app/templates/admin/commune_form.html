{% extends "base_admin.html" %}

{% block page_title %}إضافة بلدية جديدة{% endblock %}

{% block admin_content %}
<div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100 max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">إضافة بلدية جديدة</h2>

    <form method="POST">
        <div class="space-y-4">
            <!-- الاسم باللاتينية -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">الاسم (باللاتينية) *</label>
                <input type="text" name="name" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500"
                       placeholder="مثال: Algiers">
            </div>

            <!-- الاسم بالعربية -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">الاسم (بالعربية) *</label>
                <input type="text" name="name_ar" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500"
                       placeholder="مثال: الجزائر">
            </div>

            <!-- الولاية -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">الولاية *</label>
                <select name="wilaya_id" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500">
                    <option value="">اختر الولاية</option>
                    {% for wilaya in wilayas %}
                        <option value="{{ wilaya.id }}">{{ wilaya.code }} - {{ wilaya.name_ar }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- الكود (اختياري) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">الكود (اختياري)</label>
                <input type="text" name="code"
                       class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500"
                       placeholder="مثال: 1601">
            </div>
        </div>

        <div class="mt-6 flex gap-4">
            <button type="submit"
                    class="px-6 py-3 bg-primary-600 text-white rounded-xl hover:bg-primary-700 transition font-semibold">
                <i class="fas fa-plus ml-2"></i> إضافة البلدية
            </button>
            <a href="{{ url_for('admin.communes') }}"
               class="px-6 py-3 border border-gray-300 rounded-xl hover:bg-gray-50 transition font-semibold">
                إلغاء
            </a>
        </div>
    </form>
</div>
{% endblock %}
